<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>會議速記</title>
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="會議速記">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* 版面：單欄手機工具。上方錄音控制台，下方逐字稿，最下面是歷史紀錄 */
:root {
  --bg: #F4F6F8;
  --surface: #FFFFFF;
  --fg: #1A1E24;
  --muted: #5E6773;
  --line: #DCE1E7;
  --accent: #1F5BB8;
  --accent-fg: #FFFFFF;
  --accent-soft: #E3ECFA;
  --rec: #D43A3A;
  --rec-soft: #FBE3E3;
  --ok: #2F7D4F;
  --warn-bg: #FFF4D6;
  --warn-fg: #6B4E00;
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171B; --surface: #1D2127; --fg: #E8ECF1; --muted: #9AA4B0; --line: #2E343C;
    --accent: #6B9BEA; --accent-fg: #0E1520; --accent-soft: #22324D; --rec: #F06363; --rec-soft: #3A2224;
    --ok: #6CC793; --warn-bg: #3A3220; --warn-fg: #F2D894; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171B; --surface: #1D2127; --fg: #E8ECF1; --muted: #9AA4B0; --line: #2E343C;
  --accent: #6B9BEA; --accent-fg: #0E1520; --accent-soft: #22324D; --rec: #F06363; --rec-soft: #3A2224;
  --ok: #6CC793; --warn-bg: #3A3220; --warn-fg: #F2D894; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 640px; margin: 0 auto; padding-block: 12px 40px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
h2 { font-size: 13px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topbar .back { background: none; border: 0; color: var(--accent); padding: 8px 0; font-weight: 600; }

.console { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.title-input { width: 100%; font: inherit; font-size: 18px; font-weight: 600; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--fg); padding: 4px 0; border-radius: 0; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row label { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
select { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }

.recbox { display: flex; align-items: center; gap: 18px; }
.recbtn {
  flex: none; width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--rec);
  background: var(--surface); display: grid; place-items: center; transition: transform .1s;
}
.recbtn:active { transform: scale(.95); }
.recbtn .dot { width: 52px; height: 52px; border-radius: 50%; background: var(--rec); transition: all .2s; }
.recbtn.on .dot { width: 32px; height: 32px; border-radius: 6px; }
.recbtn:disabled { opacity: .5; }
.clock { font-family: var(--mono); font-size: 34px; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.1; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.status .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.live { color: var(--rec); font-weight: 600; }
.status.live .pulse { background: var(--rec); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .status.live .pulse { animation: none; } .recbtn .dot { transition: none; } }

.notice { background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }

.transcript { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; min-height: 180px; }
.transcript .empty { color: var(--muted); font-size: 15px; }
.line { display: grid; grid-template-columns: 4.6em 1fr; gap: 8px; padding: 4px 0; }
.line time { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 4px; font-variant-numeric: tabular-nums; }
.line p { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.line.interim p { color: var(--muted); }

textarea.editor { width: 100%; min-height: 50vh; font: inherit; font-size: 16px; line-height: 1.7; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; resize: vertical; }

.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: 15px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--rec); }
.btn.danger.armed { background: var(--rec); color: var(--surface); border-color: var(--rec); }
audio { width: 100%; }

.history { display: flex; flex-direction: column; gap: 8px; }
.item { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--fg); display: flex; flex-direction: column; gap: 2px; }
.item strong { font-size: 16px; }
.item .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.item .preview { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

/* 發言人與註記 */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.panel.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; box-shadow: 0 8px 18px -14px rgba(0, 0, 0, .55); }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.linkbtn { background: none; border: 0; color: var(--accent); font-size: 14px; font-weight: 600; padding: 4px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 6px 14px; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.chip.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.chip.add { border-style: dashed; color: var(--accent); }
.chip .x { color: var(--rec); font-weight: 700; }
.inline-form { display: flex; gap: 8px; }
.inline-form input, .sheet textarea { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.inline-form .btn { flex: none; padding: 8px 14px; }
.who { display: inline-block; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 0 6px; margin-right: 6px; }
.line { cursor: pointer; border-radius: 8px; }
.line:active { background: var(--accent-soft); }
.line.note p { color: var(--warn-fg); background: var(--warn-bg); border-radius: 8px; padding: 2px 8px; }
.sheet-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); color: var(--fg); width: 100%; max-width: 640px; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; gap: 12px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet textarea { min-height: 96px; resize: vertical; }
.sheet .actions { grid-template-columns: repeat(3, 1fr); }
</style>
</head>
<body>
<main>

  <!-- 錄音畫面 -->
  <section id="view-record" style="display:flex;flex-direction:column;gap:16px">
    <div class="topbar"><h1>會議速記</h1></div>

    <div class="console">
      <input id="title" class="title-input" aria-label="會議名稱" autocomplete="off">
      <div class="recbox">
        <button id="recbtn" class="recbtn" aria-label="開始錄音"><span class="dot"></span></button>
        <div>
          <div id="clock" class="clock">00:00:00</div>
          <div id="status" class="status"><span class="pulse"></span><span id="statusText">按紅色按鈕開始</span></div>
        </div>
      </div>
      <div class="row">
        <label>語言
          <select id="lang">
            <option value="zh-TW">中文（台灣）</option>
            <option value="cmn-Hans-CN">中文（普通話）</option>
            <option value="en-US">English</option>
            <option value="ja-JP">日本語</option>
          </select>
        </label>
        <label><input type="checkbox" id="keepAudio" checked> 同時保存錄音檔</label>
      </div>
      <div id="notice" class="notice" hidden></div>
      <p class="hint">錄音時請保持螢幕開啟、不要切換到其他 App，否則手機會暫停辨識。</p>
    </div>

    <div class="panel sticky" id="speakerPanel">
      <div class="panel-head">
        <h2>現在發言</h2>
        <button class="linkbtn" id="manageBtn">編輯名單</button>
      </div>
      <div class="chips" id="chips"></div>
      <form class="inline-form" id="addSpeakerForm" hidden>
        <input id="newSpeaker" placeholder="輸入部門或姓名，例如：業務部" autocomplete="off" enterkeyhint="done">
        <button class="btn primary" type="submit">加入</button>
      </form>
      <form class="inline-form" id="noteForm">
        <input id="noteInput" placeholder="插入註記，例如：決議、待辦、王經理負責" autocomplete="off" enterkeyhint="send">
        <button class="btn" type="submit">註記</button>
      </form>
    </div>

    <div id="live" class="transcript" aria-live="polite">
      <p class="empty">開始錄音後，說話內容會即時變成文字顯示在這裡。</p>
    </div>

    <div id="historyWrap" style="display:flex;flex-direction:column;gap:8px">
      <h2>過去的會議</h2>
      <div id="history" class="history"></div>
    </div>
  </section>

  <!-- 會議紀錄詳細畫面 -->
  <section id="view-detail" hidden style="flex-direction:column;gap:14px">
    <div class="topbar">
      <button class="back" id="backBtn">‹ 返回</button>
      <span id="detailMeta" class="hint"></span>
    </div>
    <input id="detailTitle" class="title-input" aria-label="會議名稱">
    <div class="actions">
      <button class="btn primary" id="shareBtn">分享</button>
      <button class="btn" id="copyBtn">複製文字</button>
      <button class="btn" id="dlTxtBtn">下載文字檔</button>
      <button class="btn" id="dlAudioBtn">下載錄音</button>
    </div>
    <audio id="player" controls hidden></audio>
    <div class="panel">
      <h2>點名字插入到游標位置</h2>
      <div class="chips" id="detailChips"></div>
    </div>
    <textarea id="editor" class="editor" aria-label="逐字稿（可直接修改）"></textarea>
    <p class="hint">逐字稿可以直接修改，會自動儲存。所有資料只存在這支手機的瀏覽器裡。</p>
    <button class="btn danger" id="delBtn">刪除這場會議</button>
  </section>

</main>

<!-- 點一句話後出現的編輯面板 -->
<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="panel-head"><h2 id="sheetTitle">編輯這一句</h2><span class="hint" id="sheetTime"></span></div>
    <textarea id="sheetText" aria-label="內容"></textarea>
    <div class="chips" id="sheetChips"></div>
    <div class="actions">
      <button class="btn danger" id="sheetDel">刪除</button>
      <button class="btn" id="sheetCancel">取消</button>
      <button class="btn primary" id="sheetSave">儲存</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* ---------------- 小工具 ---------------- */
const pad = (n) => String(n).padStart(2, "0");
function fmtClock(ms) {
  const s = Math.floor(ms / 1000);
  return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
}
function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function defaultTitle() {
  const d = new Date();
  return `會議 ${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
function notice(msg) { const n = $("notice"); n.textContent = msg || ""; n.hidden = !msg; }
function safeName(s) { return (s || "會議").replace(/[\\/:*?"<>|]/g, "_").trim() || "會議"; }

/* ---------------- 本機資料庫（IndexedDB） ---------------- */
const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open("meeting-notes", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("meetings", { keyPath: "id" });
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("meetings", mode);
      const out = fn(t.objectStore("meetings"));
      t.oncomplete = () => res(out && out.result);
      t.onerror = () => rej(t.error);
    });
  },
  put(m) { return this.tx("readwrite", (s) => s.put(m)); },
  get(id) { return this.tx("readonly", (s) => s.get(id)); },
  all() { return this.tx("readonly", (s) => s.getAll()); },
  del(id) { return this.tx("readwrite", (s) => s.delete(id)); },
};

/* ---------------- 逐字稿格式 ---------------- */
function lineBody(l) {
  if (l.note) return `※ 註記：${l.text}`;
  return (l.who ? `${l.who}：` : "") + l.text;
}
function linesToText(lines) {
  return lines.map((l) => `[${fmtClock(l.t)}] ${lineBody(l)}`).join("\n");
}
function exportText(m) {
  const body = m.text != null ? m.text : linesToText(m.lines || []);
  return `${m.title}\n日期：${fmtDate(m.created)}\n長度：${fmtClock(m.duration || 0)}\n\n${body}\n`;
}
function audioExt(type) {
  if (!type) return "webm";
  if (type.includes("mp4") || type.includes("aac")) return "m4a";
  if (type.includes("ogg")) return "ogg";
  return "webm";
}

/* ---------------- 錄音 + 即時辨識 ---------------- */
const S = {
  recording: false, start: 0, lines: [], interim: "", utterStart: 0,
  who: "", utterWho: "",
  stream: null, mr: null, chunks: [], mrType: "",
  rec: null, srRunning: false, srBroken: false, srFailCount: 0,
  wake: null, timer: null, saveTimer: null, id: null,
};

function pickMime() {
  if (!window.MediaRecorder) return "";
  for (const t of ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg;codecs=opus"]) {
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
  }
  return "";
}

function addLine(text, t, who) {
  text = (text || "").trim();
  if (!text) return;
  const l = { t, text };
  if (who) l.who = who;
  S.lines.push(l);
}
/* 一句話開始時，記下當下標記的發言人 */
function markUtterStart() {
  if (!S.utterStart) { S.utterStart = Date.now(); S.utterWho = S.who; }
}
function flushInterim() {
  if (S.interim) addLine(S.interim, (S.utterStart || Date.now()) - S.start, S.utterWho);
  S.interim = ""; S.utterStart = 0; S.utterWho = "";
}

function startRecognition() {
  if (!SR || S.srBroken || !S.recording || S.srRunning) return;
  const r = new SR();
  r.lang = $("lang").value;
  r.continuous = true;
  r.interimResults = true;
  r.onstart = () => { S.srRunning = true; };
  r.onresult = (e) => {
    S.srFailCount = 0;
    markUtterStart();
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) {
        addLine(res[0].transcript, S.utterStart - S.start, S.utterWho);
        S.utterStart = 0; S.utterWho = "";
      } else interim += res[0].transcript;
    }
    S.interim = interim;
    if (interim) markUtterStart();
    renderLive();
  };
  r.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      S.srBroken = true;
      notice("這個瀏覽器不允許語音辨識，目前只會錄音。可以把錄音檔傳到電腦用 Whisper 轉文字。");
    } else if (e.error === "audio-capture" && S.mr) {
      // 部分 Android 手機不能同時「錄音」與「辨識」：改為只辨識，以文字為優先
      stopAudioRecorder();
      notice("這支手機無法同時保存錄音與即時辨識，已改為只轉文字（不存錄音檔）。");
    } else if (e.error === "network") {
      notice("語音辨識需要網路連線，請確認手機有連上網路。錄音仍在進行。");
    }
  };
  r.onend = () => {
    S.srRunning = false;
    // 辨識中斷時，把還沒定稿的文字也保留下來
    if (S.interim) { flushInterim(); renderLive(); }
    if (S.recording && !S.srBroken && document.visibilityState === "visible") {
      S.srFailCount++;
      setTimeout(startRecognition, Math.min(3000, 200 * S.srFailCount));
    }
  };
  S.rec = r;
  try { r.start(); } catch (_) { /* 已在執行中 */ }
}

function stopAudioRecorder() {
  if (S.mr && S.mr.state !== "inactive") { try { S.mr.stop(); } catch (_) {} }
}

async function requestWake() {
  try { if ("wakeLock" in navigator) S.wake = await navigator.wakeLock.request("screen"); } catch (_) {}
}

async function startRecording() {
  notice("");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    notice("這個瀏覽器不支援錄音。請用 Chrome（Android）或 Safari（iPhone）開啟。");
    return;
  }
  const keepAudio = $("keepAudio").checked;
  if (keepAudio || !SR) {
    try {
      S.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (err) {
      notice("無法使用麥克風。請在瀏覽器設定中允許此網頁使用麥克風後再試一次。");
      return;
    }
  }
  if (!SR) notice("這個瀏覽器不支援即時轉文字，目前只會錄音。建議改用 Chrome（Android）或 Safari（iPhone）。");

  Object.assign(S, { recording: true, start: Date.now(), lines: [], interim: "", utterStart: 0,
    chunks: [], srBroken: false, srFailCount: 0, id: "m" + Date.now() });

  if (S.stream && window.MediaRecorder) {
    S.mrType = pickMime();
    try {
      S.mr = S.mrType ? new MediaRecorder(S.stream, { mimeType: S.mrType }) : new MediaRecorder(S.stream);
      S.mrType = S.mr.mimeType || S.mrType;
      S.mr.ondataavailable = (e) => { if (e.data && e.data.size) S.chunks.push(e.data); };
      S.mr.onstop = () => { if (S.stream) S.stream.getTracks().forEach((t) => t.stop()); S.stream = null; };
      S.mr.start(1000);
    } catch (_) { S.mr = null; }
  }

  startRecognition();
  requestWake();
  $("recbtn").classList.add("on");
  $("recbtn").setAttribute("aria-label", "停止錄音");
  $("status").classList.add("live");
  $("statusText").textContent = SR ? "錄音中・即時轉文字" : "錄音中";
  $("lang").disabled = true; $("keepAudio").disabled = true;
  S.timer = setInterval(() => { $("clock").textContent = fmtClock(Date.now() - S.start); }, 500);
  // 每 15 秒自動存一次文字，避免意外關閉時遺失
  S.saveTimer = setInterval(() => saveCurrent(false), 15000);
  renderLive();
}

function saveCurrent(final, audioBlob) {
  const m = {
    id: S.id, title: $("title").value.trim() || defaultTitle(), created: S.start,
    duration: Date.now() - S.start, lines: S.lines.slice(), text: null,
    audio: audioBlob || null, audioType: audioBlob ? audioBlob.type : "", draft: !final,
  };
  return DB.put(m).catch(() => {});
}

async function stopRecording() {
  S.recording = false;
  clearInterval(S.timer); clearInterval(S.saveTimer);
  $("recbtn").disabled = true;
  if (S.rec) { try { S.rec.stop(); } catch (_) {} }
  // 等辨識把最後一句送回來
  await new Promise((r) => setTimeout(r, 700));
  flushInterim();

  let blob = null;
  if (S.mr) {
    if (S.mr.state !== "inactive") {
      await new Promise((res) => { S.mr.addEventListener("stop", res, { once: true }); S.mr.stop(); });
    }
    if (S.chunks.length) blob = new Blob(S.chunks, { type: S.mrType || "audio/webm" });
  }
  if (S.stream) { S.stream.getTracks().forEach((t) => t.stop()); S.stream = null; }
  S.mr = null; S.chunks = [];
  try { if (S.wake) await S.wake.release(); } catch (_) {}
  S.wake = null;

  await saveCurrent(true, blob);
  const id = S.id;
  resetRecordUI();
  await renderHistory();
  openDetail(id);
  toast("已儲存");
}

function resetRecordUI() {
  $("recbtn").disabled = false;
  $("recbtn").classList.remove("on");
  $("recbtn").setAttribute("aria-label", "開始錄音");
  $("status").classList.remove("live");
  $("statusText").textContent = "按紅色按鈕開始";
  $("clock").textContent = "00:00:00";
  $("lang").disabled = false; $("keepAudio").disabled = false;
  $("title").value = defaultTitle();
  S.lines = []; S.interim = ""; S.who = ""; S.utterWho = "";
  closeSheet(); renderChips();
  renderLive();
}

function renderLive() {
  const box = $("live");
  if (!S.lines.length && !S.interim) {
    box.innerHTML = `<p class="empty">${S.recording ? "正在聆聽…開始說話後文字會出現在這裡。" : "開始錄音後，說話內容會即時變成文字顯示在這裡。"}</p>`;
    return;
  }
  const frag = document.createDocumentFragment();
  const mk = (l, cls, idx) => {
    const d = document.createElement("div"); d.className = "line" + (cls ? " " + cls : "");
    const tm = document.createElement("time"); tm.textContent = fmtClock(l.t);
    const p = document.createElement("p");
    if (l.note) p.textContent = "※ " + l.text;
    else {
      if (l.who) { const w = document.createElement("span"); w.className = "who"; w.textContent = l.who; p.append(w); }
      p.append(document.createTextNode(l.text));
    }
    if (idx != null) {
      d.tabIndex = 0; d.setAttribute("role", "button"); d.dataset.idx = idx;
      d.setAttribute("aria-label", "編輯：" + l.text);
    }
    d.append(tm, p); frag.append(d);
  };
  S.lines.forEach((l, i) => mk(l, l.note ? "note" : "", i));
  if (S.interim) mk({ t: (S.utterStart || Date.now()) - S.start, text: S.interim, who: S.utterWho }, "interim");
  box.replaceChildren(frag);
  if (S.recording) box.lastElementChild.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

/* 切到背景再回來時：重新保持螢幕開啟、重啟辨識 */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.recording) {
    requestWake();
    S.srFailCount = 0;
    startRecognition();
  }
});
window.addEventListener("beforeunload", (e) => { if (S.recording) { saveCurrent(false); e.preventDefault(); e.returnValue = ""; } });

$("recbtn").addEventListener("click", () => (S.recording ? stopRecording() : startRecording()));

/* ---------------- 歷史紀錄 ---------------- */
async function renderHistory() {
  let list = [];
  try { list = await DB.all(); } catch (_) {}
  list.sort((a, b) => b.created - a.created);
  const box = $("history");
  box.replaceChildren();
  if (!list.length) {
    const p = document.createElement("p"); p.className = "hint"; p.textContent = "還沒有紀錄。";
    box.append(p); return;
  }
  for (const m of list) {
    const b = document.createElement("button"); b.className = "item";
    const s = document.createElement("strong"); s.textContent = m.title;
    const meta = document.createElement("span"); meta.className = "meta";
    meta.textContent = `${fmtDate(m.created)}・${fmtClock(m.duration || 0)}${m.audio ? "・有錄音" : ""}${m.draft ? "・未正常結束" : ""}`;
    const pv = document.createElement("span"); pv.className = "preview";
    const first = m.text != null ? m.text.replace(/^\[[\d:]+\]\s*/, "") : (m.lines[0] && m.lines[0].text) || "（沒有辨識到文字）";
    pv.textContent = first;
    b.append(s, meta, pv);
    b.addEventListener("click", () => openDetail(m.id));
    box.append(b);
  }
}

/* ---------------- 詳細畫面 ---------------- */
let cur = null, audioUrl = null, editTimer;

function show(view) {
  $("view-record").hidden = view !== "record";
  $("view-detail").hidden = view !== "detail";
  $("view-detail").style.display = view === "detail" ? "flex" : "none";
  $("view-record").style.display = view === "record" ? "flex" : "none";
  window.scrollTo(0, 0);
}

async function openDetail(id) {
  cur = await DB.get(id);
  if (!cur) return;
  $("detailTitle").value = cur.title;
  $("detailMeta").textContent = `${fmtDate(cur.created)}・${fmtClock(cur.duration || 0)}`;
  $("editor").value = cur.text != null ? cur.text : linesToText(cur.lines || []);
  if (audioUrl) URL.revokeObjectURL(audioUrl);
  audioUrl = cur.audio ? URL.createObjectURL(cur.audio) : null;
  $("player").hidden = !audioUrl;
  if (audioUrl) $("player").src = audioUrl; else $("player").removeAttribute("src");
  $("dlAudioBtn").disabled = !cur.audio;
  disarmDelete();
  show("detail");
}

function persistEdits() {
  if (!cur) return;
  cur.title = $("detailTitle").value.trim() || cur.title;
  cur.text = $("editor").value;
  cur.draft = false;
  DB.put(cur).catch(() => {});
}
["detailTitle", "editor"].forEach((id) => $(id).addEventListener("input", () => {
  clearTimeout(editTimer); editTimer = setTimeout(persistEdits, 600);
}));

$("backBtn").addEventListener("click", async () => {
  clearTimeout(editTimer); persistEdits();
  if (audioUrl) { $("player").pause(); }
  await renderHistory();
  show("record");
});

function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function txtFile() {
  persistEdits();
  return new File([exportText(cur)], `${safeName(cur.title)}.txt`, { type: "text/plain" });
}
function audioFile() {
  return new File([cur.audio], `${safeName(cur.title)}.${audioExt(cur.audioType)}`, { type: cur.audioType || "audio/webm" });
}

$("copyBtn").addEventListener("click", async () => {
  persistEdits();
  const text = exportText(cur);
  try { await navigator.clipboard.writeText(text); toast("已複製，可以貼到 LINE 或 Email"); }
  catch (_) { $("editor").focus(); $("editor").select(); toast("請長按選取後複製"); }
});
$("dlTxtBtn").addEventListener("click", () => download(txtFile(), txtFile().name));
$("dlAudioBtn").addEventListener("click", () => { if (cur.audio) download(audioFile(), audioFile().name); });
$("shareBtn").addEventListener("click", async () => {
  const files = [txtFile()];
  if (cur.audio) files.push(audioFile());
  try {
    if (navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ title: cur.title, files });
    } else if (navigator.canShare && navigator.canShare({ files: [files[0]] })) {
      await navigator.share({ title: cur.title, files: [files[0]] });
    } else if (navigator.share) {
      await navigator.share({ title: cur.title, text: exportText(cur) });
    } else {
      $("copyBtn").click();
    }
  } catch (e) {
    if (e && e.name !== "AbortError") toast("無法分享，請改用「複製文字」");
  }
});

let delArmed = false, delTimer;
function disarmDelete() { delArmed = false; $("delBtn").classList.remove("armed"); $("delBtn").textContent = "刪除這場會議"; }
$("delBtn").addEventListener("click", async () => {
  if (!delArmed) {
    delArmed = true; $("delBtn").classList.add("armed"); $("delBtn").textContent = "再按一次確定刪除";
    clearTimeout(delTimer); delTimer = setTimeout(disarmDelete, 4000); return;
  }
  await DB.del(cur.id); cur = null; disarmDelete();
  await renderHistory(); show("record"); toast("已刪除");
});

/* ---------------- 發言人名單 ---------------- */
const DEFAULT_SPEAKERS = ["主席", "業務部", "財務部", "行政部"];
let speakers = DEFAULT_SPEAKERS.slice(), manageMode = false;
try { const s = JSON.parse(localStorage.getItem("speakers")); if (Array.isArray(s)) speakers = s; } catch (_) {}
function saveSpeakers() { try { localStorage.setItem("speakers", JSON.stringify(speakers)); } catch (_) {} }

function chip(label, { active, cls, onClick, ariaLabel } = {}) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip" + (cls ? " " + cls : "") + (active ? " active" : "");
  b.textContent = label;
  if (active != null) b.setAttribute("aria-pressed", active ? "true" : "false");
  if (ariaLabel) b.setAttribute("aria-label", ariaLabel);
  b.addEventListener("click", onClick);
  return b;
}

function renderChips() {
  const box = $("chips"); box.replaceChildren();
  speakers.forEach((name, i) => {
    if (manageMode) {
      const b = chip(name, { ariaLabel: `從名單移除 ${name}`, onClick: () => {
        speakers.splice(i, 1); saveSpeakers();
        if (S.who === name) S.who = "";
        renderChips(); renderDetailChips();
      } });
      const x = document.createElement("span"); x.className = "x"; x.textContent = "×"; b.append(x);
      box.append(b);
    } else {
      box.append(chip(name, { active: S.who === name, onClick: () => setWho(S.who === name ? "" : name) }));
    }
  });
  if (manageMode) {
    box.append(chip("＋ 新增", { cls: "add", onClick: () => { $("addSpeakerForm").hidden = false; $("newSpeaker").focus(); } }));
  } else if (!speakers.length) {
    const p = document.createElement("p"); p.className = "hint"; p.textContent = "按「編輯名單」加入部門或人名。"; box.append(p);
  }
  $("manageBtn").textContent = manageMode ? "完成" : "編輯名單";
}

function setWho(name) {
  S.who = name;
  // 還沒開口說話時，馬上套用到下一句
  if (!S.interim) S.utterWho = "";
  renderChips();
  if (S.recording) toast(name ? `現在發言：${name}` : "已取消發言人標記");
}

$("manageBtn").addEventListener("click", () => {
  manageMode = !manageMode;
  $("addSpeakerForm").hidden = !manageMode;
  renderChips();
});
$("addSpeakerForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("newSpeaker").value.trim().slice(0, 20);
  if (!name) return;
  if (!speakers.includes(name)) { speakers.push(name); saveSpeakers(); }
  $("newSpeaker").value = "";
  renderChips(); renderDetailChips();
});

/* ---------------- 註記 ---------------- */
$("noteForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("noteInput").value.trim();
  if (!text) return;
  if (!S.recording) { toast("開始錄音後才能插入註記"); return; }
  S.lines.push({ t: Date.now() - S.start, text, note: true });
  $("noteInput").value = "";
  renderLive();
  toast("已插入註記");
});

/* ---------------- 點一句話編輯 ---------------- */
let sheetIdx = -1, sheetWho = "";
function openSheet(idx) {
  const l = S.lines[idx];
  if (!l) return;
  sheetIdx = idx; sheetWho = l.who || "";
  $("sheetTitle").textContent = l.note ? "編輯註記" : "編輯這一句";
  $("sheetTime").textContent = fmtClock(l.t);
  $("sheetText").value = l.text;
  $("sheetChips").hidden = !!l.note;
  renderSheetChips();
  $("sheet").hidden = false;
}
function renderSheetChips() {
  const box = $("sheetChips"); box.replaceChildren();
  box.append(chip("不指定", { active: !sheetWho, onClick: () => { sheetWho = ""; renderSheetChips(); } }));
  speakers.forEach((n) => box.append(chip(n, { active: sheetWho === n, onClick: () => { sheetWho = n; renderSheetChips(); } })));
}
function closeSheet() { $("sheet").hidden = true; sheetIdx = -1; }
$("live").addEventListener("click", (e) => {
  const d = e.target.closest(".line[data-idx]");
  if (d) openSheet(+d.dataset.idx);
});
$("live").addEventListener("keydown", (e) => {
  const d = e.target.closest(".line[data-idx]");
  if (d && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openSheet(+d.dataset.idx); }
});
$("sheetCancel").addEventListener("click", closeSheet);
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });
$("sheetSave").addEventListener("click", () => {
  const l = S.lines[sheetIdx];
  if (l) {
    const text = $("sheetText").value.trim();
    if (text) l.text = text;
    if (!l.note) { if (sheetWho) l.who = sheetWho; else delete l.who; }
  }
  closeSheet(); renderLive();
});
$("sheetDel").addEventListener("click", () => {
  if (sheetIdx >= 0) S.lines.splice(sheetIdx, 1);
  closeSheet(); renderLive();
});

/* ---------------- 會後編輯：插入發言人 ---------------- */
function renderDetailChips() {
  const box = $("detailChips"); box.replaceChildren();
  speakers.forEach((n) => box.append(chip(n, { onClick: () => insertAtCursor(`${n}：`) })));
  box.append(chip("※ 註記", { onClick: () => insertAtCursor("※ 註記：") }));
}
function insertAtCursor(str) {
  const ta = $("editor");
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
  ta.value = ta.value.slice(0, s) + str + ta.value.slice(e);
  ta.focus();
  ta.setSelectionRange(s + str.length, s + str.length);
  ta.dispatchEvent(new Event("input"));
}

/* ---------------- 啟動 ---------------- */
renderChips();
renderDetailChips();
$("title").value = defaultTitle();
try { const l = localStorage.getItem("lang"); if (l) $("lang").value = l; } catch (_) {}
$("lang").addEventListener("change", () => { try { localStorage.setItem("lang", $("lang").value); } catch (_) {} });
if (!SR) notice("這個瀏覽器不支援即時轉文字（只能錄音）。Android 請用 Chrome，iPhone 請用 Safari 開啟；LINE 內建瀏覽器請點右上角改用外部瀏覽器開啟。");
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
renderHistory();
</script>
</body>
